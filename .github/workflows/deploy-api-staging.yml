name: Deploy API to Staging

on:
  push:
    branches:
      - develop
    paths:
      - "apps/api/**"
      - "apps/image-processor-lightweight/**"
      - "apps/image-processor-rembg/**"
      - "packages/business-rules/**"
      - "packages/shared-types/**"
      - "packages/database/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/deploy-staging-migrations.mjs"
      - "scripts/cleanup-staging-test-data.mjs"
      - "scripts/staging-test-data-cleanup-lib.mjs"
      - "tsconfig.base.json"
      - "Dockerfile.api"
      - ".dockerignore"
      - ".github/workflows/deploy-api-staging.yml"
  workflow_dispatch:
    inputs:
      run_live_openai_smoke:
        description: Run one billable live OpenAI recognition check after deployment
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-staging
  cancel-in-progress: false

env:
  IMAGE_NAME: api
  MIGRATION_JOB_NAME: online-saler-db-migrate-staging
  SMOKE_CLEANUP_JOB_NAME: online-saler-deploy-smoke-cleanup-staging
  LEGACY_TEST_BATCH_CODES: BATCH-1785507292547;BATCH-1785580900516
  STAGING_RUNTIME_SERVICE_ACCOUNT: online-saler-api-staging@online-saler-staging.iam.gserviceaccount.com
  STAGING_CLOUD_SQL_INSTANCE: online-saler-staging:africa-south1:online-saler-staging-db
  PRODUCT_IMAGE_BUCKET: online-saler-staging-product-images
  OPENAI_VISION_MODEL: gpt-4o-mini
  OPENAI_DETAIL_MODEL: gpt-4o-mini
  OPENAI_DETAIL_INPUT_USD_PER_MILLION: "0.15"
  OPENAI_DETAIL_OUTPUT_USD_PER_MILLION: "0.60"
  OPENAI_IMAGE_EDIT_MODEL: gpt-image-2.5-sunburst
  OPENAI_IMAGE_EDIT_QUALITY: medium
  OPENAI_API_KEY_SECRET: STAGING_OPENAI_API_KEY

jobs:
  freshness:
    name: Skip if a newer commit is already deployed
    runs-on: ubuntu-latest
    outputs:
      skip: ${{ steps.check.outputs.skip }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Compare with the deployed commit
        id: check
        run: |
          # Two pushes merged a minute apart can finish out of order; without this the
          # older commit's run deploys last and silently rolls the service back.
          DEPLOYED_IMAGE="$(gcloud run services describe "${{ vars.GCP_SERVICE_NAME }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format "value(spec.template.spec.containers[0].image)" 2>/dev/null || true)"
          DEPLOYED_SHA="${DEPLOYED_IMAGE##*:}"
          echo "Deployed image: ${DEPLOYED_IMAGE:-none}"

          if [ -n "${DEPLOYED_SHA}" ] \
            && [ "${DEPLOYED_SHA}" != "${GITHUB_SHA}" ] \
            && git merge-base --is-ancestor "${GITHUB_SHA}" "${DEPLOYED_SHA}" 2>/dev/null; then
            echo "${GITHUB_SHA} is older than the deployed ${DEPLOYED_SHA}; skipping deploy."
            echo "skip=true" >> "${GITHUB_OUTPUT}"
          else
            echo "skip=false" >> "${GITHUB_OUTPUT}"
          fi

  deploy:
    needs: freshness
    if: needs.freshness.outputs.skip != 'true'
    name: Migrate schema, storage, build and deploy API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@v2

      - name: Verify OpenAI API key secret
        run: |
          # The key lives in Secret Manager, never in a plaintext Cloud Run env var and
          # never in a repository secret, so a project viewer cannot read it back.
          if ! gcloud secrets versions describe latest \
            --secret "${OPENAI_API_KEY_SECRET}" \
            --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            echo "Secret Manager secret ${OPENAI_API_KEY_SECRET} has no accessible latest version."
            echo "Create it once with: gcloud secrets create ${OPENAI_API_KEY_SECRET} --replication-policy=automatic"
            exit 1
          fi

      - name: Configure product image bucket
        run: |
          if ! gcloud storage buckets describe "gs://${PRODUCT_IMAGE_BUCKET}" --project "${{ vars.GCP_PROJECT_ID }}" >/dev/null 2>&1; then
            gcloud storage buckets create "gs://${PRODUCT_IMAGE_BUCKET}" \
              --project "${{ vars.GCP_PROJECT_ID }}" \
              --location "${{ vars.GCP_REGION }}" \
              --uniform-bucket-level-access
          fi

          gcloud storage buckets update "gs://${PRODUCT_IMAGE_BUCKET}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --uniform-bucket-level-access

          gcloud storage buckets add-iam-policy-binding "gs://${PRODUCT_IMAGE_BUCKET}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --member "serviceAccount:${STAGING_RUNTIME_SERVICE_ACCOUNT}" \
            --role "roles/storage.objectAdmin"

      - name: Configure Docker for Artifact Registry
        run: |
          gcloud auth configure-docker \
            "${{ vars.GCP_REGION }}-docker.pkg.dev" \
            --quiet

      - name: Build Docker image
        run: |
          IMAGE_URI="${{ vars.GCP_REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ vars.GCP_ARTIFACT_REPOSITORY }}/${IMAGE_NAME}:${GITHUB_SHA}"

          docker build \
            --file Dockerfile.api \
            --tag "${IMAGE_URI}" \
            .

          echo "IMAGE_URI=${IMAGE_URI}" >> "${GITHUB_ENV}"

      - name: Push Docker image
        run: docker push "${IMAGE_URI}"

      - name: Configure staging schema job
        run: |
          gcloud run jobs deploy "${MIGRATION_JOB_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${IMAGE_URI}" \
            --service-account "${STAGING_RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances "${STAGING_CLOUD_SQL_INSTANCE}" \
            --set-secrets "DATABASE_URL=STAGING_DATABASE_URL:latest" \
            --command npm \
            --args run,db:migrate-staging \
            --max-retries 0 \
            --task-timeout 10m \
            --quiet

      - name: Run staging migrations and seed test operator
        id: synchronize_staging_schema
        run: |
          set +e
          OUTPUT="$(gcloud run jobs execute "${MIGRATION_JOB_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --wait \
            --quiet 2>&1)"
          STATUS=$?
          set -e

          echo "${OUTPUT}"

          EXECUTION_NAME="$(printf '%s\n' "${OUTPUT}" | sed -n 's/.*gcloud run jobs executions describe \([^[:space:]]*\).*/\1/p' | tail -n 1)"
          if [ -n "${EXECUTION_NAME}" ]; then
            echo "execution_name=${EXECUTION_NAME}" >> "${GITHUB_OUTPUT}"
          fi

          if [ "${STATUS}" -ne 0 ]; then
            exit "${STATUS}"
          fi

      - name: Print staging schema job diagnostics
        if: failure() && steps.synchronize_staging_schema.outputs.execution_name != ''
        run: |
          EXECUTION_NAME="${{ steps.synchronize_staging_schema.outputs.execution_name }}"
          SINCE="$(date -u -d '20 minutes ago' +%Y-%m-%dT%H:%M:%SZ)"

          echo "Cloud Run job execution: ${EXECUTION_NAME}"
          gcloud run jobs executions describe "${EXECUTION_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --format yaml || true

          echo "Recent Cloud Run job logs since ${SINCE}:"
          gcloud logging read \
            "resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"${MIGRATION_JOB_NAME}\" AND timestamp>=\"${SINCE}\"" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --limit 200 \
            --format "table(timestamp,severity,textPayload,jsonPayload.message)" || true

      - name: Deploy Cloud Run service
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v3
        with:
          service: ${{ vars.GCP_SERVICE_NAME }}
          region: ${{ vars.GCP_REGION }}
          image: ${{ env.IMAGE_URI }}
          flags: >-
            --allow-unauthenticated
            --port=4000
            --memory=2Gi
            --cpu=1
            --min-instances=0
            --max-instances=2
            --service-account=${{ env.STAGING_RUNTIME_SERVICE_ACCOUNT }}
            --add-cloudsql-instances=${{ env.STAGING_CLOUD_SQL_INSTANCE }}
            --remove-env-vars=OPENAI_API_KEY
          env_vars: |
            NODE_ENV=staging
            STAGING_PILOT_BATCH_ENABLED=true
            PRODUCT_IMAGE_BUCKET=${{ env.PRODUCT_IMAGE_BUCKET }}
            AI_PROVIDER_MODE=openai
            OPENAI_VISION_MODEL=${{ env.OPENAI_VISION_MODEL }}
            OPENAI_DETAIL_MODEL=${{ env.OPENAI_DETAIL_MODEL }}
            OPENAI_DETAIL_INPUT_USD_PER_MILLION=${{ env.OPENAI_DETAIL_INPUT_USD_PER_MILLION }}
            OPENAI_DETAIL_OUTPUT_USD_PER_MILLION=${{ env.OPENAI_DETAIL_OUTPUT_USD_PER_MILLION }}
            OPENAI_IMAGE_EDIT_MODEL=${{ env.OPENAI_IMAGE_EDIT_MODEL }}
            OPENAI_IMAGE_EDIT_QUALITY=${{ env.OPENAI_IMAGE_EDIT_QUALITY }}
          # --remove-env-vars runs before the secret is attached, so a revision that
          # still carries the old plaintext OPENAI_API_KEY converts to the Secret Manager
          # reference in one step, with no revision in between that has no key at all.
          # Leaving the flag in place also stops the plaintext form from coming back.
          secrets: |
            DATABASE_URL=STAGING_DATABASE_URL:latest
            OPENAI_API_KEY=STAGING_OPENAI_API_KEY:latest

      - name: Verify health endpoint
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"

          echo "Service URL: ${SERVICE_URL}"
          curl \
            --fail \
            --show-error \
            --silent \
            --retry 10 \
            --retry-delay 5 \
            "${SERVICE_URL}/health"

      - name: Authenticate deployment smoke checks
        env:
          SERVICE_URL: ${{ steps.deploy.outputs.url }}
          # Both values must come from repository secrets so GitHub masks them in logs.
          # Never add a literal fallback here: this repository and its Actions logs are public.
          STAGING_ADMIN_LOGIN: ${{ secrets.STAGING_ADMIN_LOGIN }}
          STAGING_ADMIN_PASSWORD: ${{ secrets.STAGING_ADMIN_PASSWORD }}
        run: |
          if [ -z "${STAGING_ADMIN_LOGIN}" ] || [ -z "${STAGING_ADMIN_PASSWORD}" ]; then
            echo "STAGING_ADMIN_LOGIN and STAGING_ADMIN_PASSWORD repository secrets must be configured."
            exit 1
          fi
          node scripts/verify-staging-image-processing.mjs --authenticate

      - name: Verify product creation
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          PRODUCT_CODE="DEPLOY-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          RESPONSE="$(curl \
            --fail-with-body \
            --show-error \
            --silent \
            --retry 5 \
            --retry-delay 3 \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"productCode\":\"${PRODUCT_CODE}\"}" \
            --header "Authorization: Bearer ${STAGING_SMOKE_ACCESS_TOKEN}" \
            "${SERVICE_URL}/products")"

          echo "${RESPONSE}"
          echo "${RESPONSE}" | grep -q '"status":"DRAFT"'
          echo "${RESPONSE}" | grep -Fq "\"createdByEmployeeId\":\"${STAGING_SMOKE_EMPLOYEE_ID}\""

      - name: Verify real image upload and retrieval
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          PRODUCT_CODE="UPLOAD-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PRODUCT_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"productCode\":\"${PRODUCT_CODE}\"}" \
            --header "Authorization: Bearer ${STAGING_SMOKE_ACCESS_TOKEN}" \
            "${SERVICE_URL}/products")"
          PRODUCT_ID="$(printf '%s' "${PRODUCT_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).id))')"

          printf '%s' 'iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAQAAAC1HAwCAAAAC0lEQVR42mP8/x8AAusB9Wl2ZQAAAABJRU5ErkJggg==' | base64 --decode > /tmp/product-test.png

          IMAGE_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: image/png" \
            --header "X-Image-Type: FRONT" \
            --data-binary @/tmp/product-test.png \
            --header "Authorization: Bearer ${STAGING_SMOKE_ACCESS_TOKEN}" \
            "${SERVICE_URL}/products/${PRODUCT_ID}/images/upload")"

          echo "${IMAGE_RESPONSE}"
          IMAGE_ID="$(printf '%s' "${IMAGE_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).id))')"
          echo "${IMAGE_RESPONSE}" | grep -q "gs://${PRODUCT_IMAGE_BUCKET}/staging/products/${PRODUCT_ID}/"

          curl --fail --silent --show-error \
            "${SERVICE_URL}/products/${PRODUCT_ID}/images/${IMAGE_ID}/content" \
            --output /tmp/product-test-downloaded.png
          cmp /tmp/product-test.png /tmp/product-test-downloaded.png

          RETIRED_STATUS="$(curl --silent --show-error --output /tmp/retired-image-operation.json --write-out '%{http_code}' \
            --request POST \
            --header "Content-Type: application/json" \
            --header "Authorization: Bearer ${STAGING_SMOKE_ACCESS_TOKEN}" \
            --data '{"operation":"REMOVE_BACKGROUND"}' \
            "${SERVICE_URL}/products/${PRODUCT_ID}/images/${IMAGE_ID}/processing-jobs")"
          test "${RETIRED_STATUS}" = "400"
          node -e 'const r=JSON.parse(require("node:fs").readFileSync("/tmp/retired-image-operation.json","utf8"));if(!String(r.message).includes("Cutout processing is retired"))throw Error("Unexpected retired-operation response")'

      - name: Verify Operations workspace API
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"

          SUMMARY="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${STAGING_SMOKE_ACCESS_TOKEN}" \
            "${SERVICE_URL}/operations/workspace/summary")"
          echo "${SUMMARY}"
          echo "${SUMMARY}" | grep -q '"completedToday"'

          START="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{}" \
            --header "Authorization: Bearer ${STAGING_SMOKE_ACCESS_TOKEN}" \
            "${SERVICE_URL}/operations/workspace/start")"
          echo "${START}"
          echo "${START}" | grep -q '"product"'
          echo "${START}" | grep -Fq "\"employeeId\":\"${STAGING_SMOKE_EMPLOYEE_ID}\""

      - name: Verify product control API
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"

          CONTROL_SUMMARY="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${STAGING_SMOKE_ACCESS_TOKEN}" \
            "${SERVICE_URL}/operations/product-control/summary")"
          echo "${CONTROL_SUMMARY}"
          echo "${CONTROL_SUMMARY}" | grep -q '"readyForPrice"'
          echo "${CONTROL_SUMMARY}" | grep -q '"readyToPublish"'
          echo "${CONTROL_SUMMARY}" | grep -q '"available"'
          echo "${CONTROL_SUMMARY}" | grep -q '"published"'

          CONTROL_PRODUCTS="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${STAGING_SMOKE_ACCESS_TOKEN}" \
            "${SERVICE_URL}/operations/product-control/products")"
          echo "${CONTROL_PRODUCTS}" | grep -q '^\['

      - name: Verify public storefront products API
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"

          PUBLIC_PRODUCTS="$(curl --fail-with-body --silent --show-error \
            "${SERVICE_URL}/public/products")"
          echo "${PUBLIC_PRODUCTS}" | grep -q '^\['

          PUBLIC_FILTERS="$(curl --fail-with-body --silent --show-error \
            "${SERVICE_URL}/public/products/filters")"
          echo "${PUBLIC_FILTERS}" | grep -q '"categories"'
          echo "${PUBLIC_FILTERS}" | grep -q '"total"'

      - name: Verify OpenAI image recognition
        if: github.event_name == 'workflow_dispatch' && inputs.run_live_openai_smoke
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.url }}"
          PRODUCT_CODE="OPENAI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          PRODUCT_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"productCode\":\"${PRODUCT_CODE}\"}" \
            --header "Authorization: Bearer ${STAGING_SMOKE_ACCESS_TOKEN}" \
            "${SERVICE_URL}/products")"
          PRODUCT_ID="$(printf '%s' "${PRODUCT_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).id))')"

          python3 - <<'PY'
          import struct
          import zlib

          width = 128
          height = 128
          raw = b"".join(b"\x00" + bytes([238, 96, 80]) * width for _ in range(height))

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xFFFFFFFF)
              )

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", width, height, 8, 2, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(raw))
              + chunk(b"IEND", b"")
          )

          with open("/tmp/openai-test.png", "wb") as file:
              file.write(png)
          PY

          IMAGE_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: image/png" \
            --header "X-Image-Type: FRONT" \
            --data-binary @/tmp/openai-test.png \
            --header "Authorization: Bearer ${STAGING_SMOKE_ACCESS_TOKEN}" \
            "${SERVICE_URL}/products/${PRODUCT_ID}/images/upload")"
          IMAGE_ID="$(printf '%s' "${IMAGE_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).id))')"

          AI_RESPONSE="$(curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Content-Type: application/json" \
            --data "{\"productId\":\"${PRODUCT_ID}\",\"imageIds\":[\"${IMAGE_ID}\"],\"promptVersion\":\"product-v1\"}" \
            --header "Authorization: Bearer ${STAGING_SMOKE_ACCESS_TOKEN}" \
            "${SERVICE_URL}/ai-jobs")"

          echo "${AI_RESPONSE}"
          echo "${AI_RESPONSE}" | grep -q '"status":"SUCCEEDED"'
          echo "${AI_RESPONSE}" | grep -q '"provider":"openai"'
          AI_JOB_ID="$(printf '%s' "${AI_RESPONSE}" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>process.stdout.write(JSON.parse(s).extractionId))')"
          AI_STATUS="$(curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${STAGING_SMOKE_ACCESS_TOKEN}" \
            "${SERVICE_URL}/ai-jobs/${AI_JOB_ID}")"
          echo "${AI_STATUS}" | grep -q '"status":"SUCCEEDED"'

      - name: Configure staging smoke-test cleanup job
        run: |
          gcloud run jobs deploy "${SMOKE_CLEANUP_JOB_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --image "${IMAGE_URI}" \
            --service-account "${STAGING_RUNTIME_SERVICE_ACCOUNT}" \
            --set-cloudsql-instances "${STAGING_CLOUD_SQL_INSTANCE}" \
            --set-secrets "DATABASE_URL=STAGING_DATABASE_URL:latest" \
            --set-env-vars "NODE_ENV=staging,PRODUCT_IMAGE_BUCKET=${PRODUCT_IMAGE_BUCKET},STAGING_TEST_DATA_CONFIRMATION=DRY_RUN,STAGING_TEST_BATCH_CODES=${LEGACY_TEST_BATCH_CODES}" \
            --command node \
            --args scripts/cleanup-staging-test-data.mjs \
            --max-retries 0 \
            --task-timeout 20m \
            --quiet

      - name: Inventory authorized staging test data
        run: |
          gcloud run jobs execute "${SMOKE_CLEANUP_JOB_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --wait \
            --quiet

      - name: Authorize staging test-data deletion
        run: |
          gcloud run jobs update "${SMOKE_CLEANUP_JOB_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --update-env-vars "STAGING_TEST_DATA_CONFIRMATION=DELETE_STAGING_TEST_DATA" \
            --quiet

      - name: Remove authorized staging test data
        run: |
          gcloud run jobs execute "${SMOKE_CLEANUP_JOB_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --wait \
            --quiet

      - name: Remove staging smoke-test cleanup job
        if: always()
        run: |
          gcloud run jobs delete "${SMOKE_CLEANUP_JOB_NAME}" \
            --project "${{ vars.GCP_PROJECT_ID }}" \
            --region "${{ vars.GCP_REGION }}" \
            --quiet || true
